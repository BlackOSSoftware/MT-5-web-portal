<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TradingView Advanced Chart</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    .tradingview-widget-container, .tradingview-widget-container__widget { width:100%; height:100%; }
  </style>
</head>
<body>
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var dark = q.get("theme") === "dark";
      var pageBg = dark ? "#1A1A1E" : "#ffffff";
      var chartBg = dark ? "rgba(26, 26, 30, 1)" : "rgba(255, 255, 255, 1)";
      document.documentElement.style.background = pageBg;
      document.body.style.background = pageBg;

      var config = {
        autosize: true,
        symbol: q.get("symbol") || "OANDA:XAUUSD",
        interval: q.get("interval") || "5",
        timezone: "Etc/UTC",
        theme: dark ? "dark" : "light",
        style: q.get("style") || "1",
        locale: "en",
        backgroundColor: chartBg,
        hide_top_toolbar: false,
        hide_legend: false,
        hide_side_toolbar: q.get("toolbar") === "0",
        allow_symbol_change: false,
        save_image: false,
        calendar: false,
        hide_volume: true,
        support_host: "https://www.tradingview.com",
        studies: [],
        overrides: {
          "mainSeriesProperties.candleStyle.upColor": "#22c55e",
          "mainSeriesProperties.candleStyle.downColor": "#ef4444",
          "mainSeriesProperties.candleStyle.wickUpColor": "#22c55e",
          "mainSeriesProperties.candleStyle.wickDownColor": "#ef4444",
          "mainSeriesProperties.candleStyle.borderUpColor": "#22c55e",
          "mainSeriesProperties.candleStyle.borderDownColor": "#ef4444"
        },
        disabled_features: [
          "create_volume_indicator_by_default",
          "volume_force_overlay",
          "header_widget"
        ]
      };

      var s = document.createElement("script");
      s.type = "text/javascript";
      s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
      s.async = true;
      s.text = JSON.stringify(config);
      document.querySelector(".tradingview-widget-container").appendChild(s);
    })();
  </script>
</body>
</html>
